name: GameMonitor CI

# Compile l'overlay GameMonitor (Rust, MSVC) en Release et publie l'exe portable
# comme artefact téléchargeable depuis l'onglet Actions.

on:
  push:
    branches: [ main ]
    paths:
      - 'lapriselemay_solution#1/GameMonitor/**'
      - '.github/workflows/gamemonitor-ci.yml'
  pull_request:
    paths:
      - 'lapriselemay_solution#1/GameMonitor/**'
      - '.github/workflows/gamemonitor-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: 'lapriselemay_solution#1/GameMonitor'

    steps:
      - uses: actions/checkout@v4

      # sysinfo 0.40 exige Rust 1.95 ou plus récent.
      - name: Toolchain Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Build Release
        run: cargo build --release --locked

      - name: Exe portable
        uses: actions/upload-artifact@v4
        with:
          name: GameMonitor
          path: 'lapriselemay_solution#1/GameMonitor/target/release/GameMonitor.exe'
          if-no-files-found: error
