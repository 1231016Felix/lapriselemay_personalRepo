name: QuickLauncher CI

# Restauration, build Release, tests, audit des dépendances (transitives comprises)
# et contrôle de non-divulgation du jeton par le script de release.

on:
  push:
    branches: [ main ]
    paths:
      - 'lapriselemay_solution#1/**'
      - '.github/workflows/quicklauncher-ci.yml'
  pull_request:
    paths:
      - 'lapriselemay_solution#1/**'
      - '.github/workflows/quicklauncher-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: 'lapriselemay_solution#1'

    steps:
      - uses: actions/checkout@v4

      # global.json (10.0.100, rollForward latestFeature) accepte toute bande 10.0.x récente
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restauration
        run: dotnet restore 'QuickLauncher.Tests/QuickLauncher.Tests.csproj'

      - name: Build Release
        run: dotnet build 'QuickLauncher.Tests/QuickLauncher.Tests.csproj' -c Release --no-restore -nologo

      - name: Tests
        run: dotnet test 'QuickLauncher.Tests/QuickLauncher.Tests.csproj' -c Release --no-build -nologo --logger "trx;LogFileName=tests.trx"

      - name: Audit des dépendances vulnérables
        run: |
          $report = dotnet list 'QuickLauncher/QuickLauncher.csproj' package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $vulnerable = @($report.projects | ForEach-Object { $_.frameworks } | ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } | Where-Object { $_ -and $_.vulnerabilities })
          if ($vulnerable.Count -gt 0) {
            foreach ($package in $vulnerable) {
              Write-Output "::error::Paquet vulnérable : $($package.id) $($package.resolvedVersion)"
            }
            exit 1
          }
          Write-Output 'Aucune dépendance vulnérable connue.'

      - name: Le script de release ne divulgue pas le jeton
        run: ./tools/Test-ReleaseSecrets.ps1

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: 'lapriselemay_solution#1/QuickLauncher.Tests/TestResults/*.trx'
          if-no-files-found: ignore